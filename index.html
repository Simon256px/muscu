/* ---------- Stats : durée et poids soulevé par semaine / mois / année ---------- */
// une seule série par graphique → pas de légende, le titre dit ce qui est tracé ;
// Durée en Violet, Poids en Ochre (contraste 2,99:1 sur la carte → vue tableau + étiquette du max)
let ST = {per: 'week', metric: 'dur', off: 0, table: false};
let statBuckets = [];
const PER = {
  week: {n: 12, label: 'Semaine', cur: 'cette semaine', prev: 'semaine dernière'},
  month: {n: 12, label: 'Mois', cur: 'ce mois-ci', prev: 'mois dernier'},
  year: {n: 0, label: 'Année', cur: 'cette année', prev: 'année dernière'},
};
const METRIC = {
  dur: {label: 'Durée', color: 'var(--violet)', get: b => b.dur, fmt: v => fmtHM(v)},
  vol: {label: 'Poids soulevé', color: 'var(--ochre)', get: b => b.vol, fmt: v => fmtVol(v)},
};
function fmtHM(sec) { const m = Math.round(sec / 60), h = Math.floor(m / 60); return h ? `${h} h ${String(m % 60).padStart(2, '0')} min` : `${m} min`; }
const fmtVol = kg => Math.round(kg).toLocaleString('fr-FR') + ' kg';
function perStart(d, per) {
  if (per === 'week') return mondayOf(d);
  return per === 'month' ? new Date(d.getFullYear(), d.getMonth(), 1) : new Date(d.getFullYear(), 0, 1);
}
function perAdd(d, per, n) {
  const x = new Date(d);
  if (per === 'week') x.setDate(x.getDate() + 7 * n);
  else if (per === 'month') x.setMonth(x.getMonth() + n);
  else x.setFullYear(x.getFullYear() + n);
  return x;
}
const perKey = (d, per) => isoDay(perStart(d, per));
function perLabel(d, per, long) {
  if (per === 'year') return String(d.getFullYear());
  if (per === 'month') return long ? fmtDate(d, {month: 'long', year: 'numeric'}) : fmtDate(d, {month: 'short'}) + (d.getMonth() === 0 ? ' ' + String(d.getFullYear()).slice(2) : '');
  return long ? 'Semaine du ' + fmtDate(d, {day: 'numeric', month: 'short', year: 'numeric'}) : fmtDate(d, {day: 'numeric', month: 'short'});
}
function aggregate(per) {
  const m = new Map();
  for (const s of allSessions()) {
    const k = perKey(new Date(s.date), per), b = m.get(k) || {dur: 0, vol: 0, n: 0};
    b.dur += s.dur || 0; b.vol += volume(s); b.n++; m.set(k, b);
  }
  return m;
}
// combien de fenêtres reculer pour voir la dernière séance
function offToLast() {
  const last = allSessions()[0]; if (!last || ST.per === 'year') return 0;
  const a = perStart(new Date(), ST.per), b = perStart(new Date(last.date), ST.per);
  const diff = ST.per === 'week' ? Math.round((a - b) / 6048e5) : (a.getFullYear() - b.getFullYear()) * 12 + a.getMonth() - b.getMonth();
  return Math.floor(diff / PER[ST.per].n);
}
function niceStep(max) {
  const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw)), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function vStats() {
  const P = PER[ST.per], M = METRIC[ST.metric], agg = aggregate(ST.per), now = new Date();
  // périodes affichées
  let starts = [];
  if (ST.per === 'year') {
    const first = allSessions().length ? new Date(allSessions()[allSessions().length - 1].date).getFullYear() : now.getFullYear();
    for (let y = first; y <= now.getFullYear(); y++) starts.push(new Date(y, 0, 1));
  } else {
    const end = perAdd(perStart(now, ST.per), ST.per, -ST.off * P.n);
    for (let i = P.n - 1; i >= 0; i--) starts.push(perAdd(end, ST.per, -i));
  }
  const curKey = perKey(now, ST.per);
  statBuckets = starts.map(d => ({d, key: isoDay(d), ...(agg.get(isoDay(d)) || {dur: 0, vol: 0, n: 0})}));
  const vals = statBuckets.map(M.get), max = Math.max(...vals);
  const cur = agg.get(curKey) || {dur: 0, vol: 0, n: 0};
  const prev = agg.get(perKey(perAdd(perStart(now, ST.per), ST.per, -1), ST.per)) || {dur: 0, vol: 0, n: 0};
  // échelle : heures pour la durée, kg pour le poids
  const unit = ST.metric === 'dur' ? 3600 : 1;
  const step = max > 0 ? niceStep(max / unit) * unit : unit * (ST.metric === 'dur' ? 1 : 1000);
  const top = Math.max(step, Math.ceil(max / step) * step), ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(v);
  const tickLabel = v => ST.metric === 'dur' ? (Number.isInteger(Math.round(v / 60) / 60) ? v / 3600 + ' h' : fmtHM(v)) : Math.round(v).toLocaleString('fr-FR');
  const iMax = max > 0 ? vals.indexOf(max) : -1;
  const tot = statBuckets.reduce((a, b) => ({dur: a.dur + b.dur, vol: a.vol + b.vol, n: a.n + b.n}), {dur: 0, vol: 0, n: 0});

  let h = `<h1>Stats</h1>
    <div class="filters">
      <div class="seg">${Object.entries(PER).map(([k, p]) => `<button data-act="stper" data-v="${k}" class="${ST.per === k ? 'on' : ''}">${p.label}</button>`).join('')}</div>
      <div class="seg">${Object.entries(METRIC).map(([k, m]) => `<button data-act="stmet" data-v="${k}" class="${ST.metric === k ? 'on' : ''}">${m.label}</button>`).join('')}</div>
      <div class="spacer"></div>
      <button class="btn ${ST.table ? 'primary' : ''}" data-act="sttable">${ST.table ? '✓ Tableau' : 'Tableau'}</button>
    </div>
    <div class="card">
      <div class="exname">${M.label}</div>
      <div class="hero">${M.fmt(M.get(cur))}</div>
      <div class="muted">${P.cur} · ${cur.n} séance${cur.n > 1 ? 's' : ''} — ${P.prev} : ${M.fmt(M.get(prev))}</div>
      ${ST.per !== 'year' ? `<div class="row" style="margin-top:16px">
        <button class="btn" data-act="stoff" data-v="1" title="Période précédente">‹</button>
        <span class="small" style="font-weight:600">${esc(perLabel(starts[0], ST.per, true))} → ${esc(perLabel(starts[starts.length - 1], ST.per, true))}</span>
        <button class="btn" data-act="stoff" data-v="-1" ${ST.off ? '' : 'disabled'} title="Période suivante">›</button>
        ${ST.off ? `<button class="btn ghost" data-act="stnow">Revenir à aujourd'hui</button>` : ''}</div>` : ''}
      <div class="chart" style="--c:${M.color}">
        <div class="yax">${ticks.map(v => `<span style="bottom:${v / top * 100}%">${tickLabel(v)}</span>`).join('')}</div>
        <div class="plot">
          ${ticks.slice(1).map(v => `<div class="gl" style="bottom:${v / top * 100}%"></div>`).join('')}
          <div class="cols">${statBuckets.map((b, i) => { const v = M.get(b), pct = v / top * 100; return `<div class="col" data-i="${i}" tabindex="0" aria-label="${esc(perLabel(b.d, ST.per, true))} : ${esc(M.fmt(v))}">
            ${v > 0 ? `<div class="bar" style="height:${pct}%"></div>` : ''}
            ${i === iMax ? `<span class="vlab" style="bottom:calc(${pct}% + 4px)">${esc(M.fmt(v))}</span>` : ''}</div>`; }).join('')}</div>
          ${max === 0 ? `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center">
            <span class="muted">Aucune séance sur cette période.</span>
            ${ST.per !== 'year' && allSessions().length ? `<button class="btn primary" data-act="stlast">Voir ma dernière séance</button>` : ''}</div>` : ''}
        </div>
        <div class="xax">${statBuckets.map((b, i) => `<span class="${b.key === curKey ? 'cur' : ''} ${(statBuckets.length - 1 - i) % 2 ? 'odd' : ''}">${esc(perLabel(b.d, ST.per))}</span>`).join('')}</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="muted small">Séances</span><b>${tot.n}</b></div>
      <div class="stat"><span class="muted small">Durée totale</span><b>${esc(fmtDur(tot.dur))}</b></div>
      <div class="stat"><span class="muted small">Poids soulevé</span><b>${tot.vol >= 1e5 ? (tot.vol / 1000).toLocaleString('fr-FR', {maximumFractionDigits: 0}) + ' t' : esc(fmtVol(tot.vol))}</b></div>
      <div class="stat"><span class="muted small">Moyenne / séance</span><b>${tot.n ? esc(fmtDur(tot.dur / tot.n)) : '—'}</b></div>
    </div>
    <p class="muted small">Sur la période affichée. Poids soulevé = kg × répétitions de chaque série (les exercices au poids du corps comptent 0).</p>`;
  if (ST.table) h += `<div class="card"><table class="data"><thead><tr><th>${P.label}</th><th>Séances</th><th>Durée</th><th>Poids soulevé</th></tr></thead><tbody>
    ${[...statBuckets].reverse().map(b => `<tr><td>${esc(perLabel(b.d, ST.per, true))}</td><td>${b.n}</td><td>${b.n ? esc(fmtHM(b.dur)) : '—'}</td><td>${b.n ? esc(fmtVol(b.vol)) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}
function showTip(col) {
  const b = statBuckets[+col.dataset.i]; if (!b) return;
  const M = METRIC[ST.metric], r = col.getBoundingClientRect(), bar = col.querySelector('.bar');
  const t = $('#tip');
  t.innerHTML = `${esc(perLabel(b.d, ST.per, true))}<br><b>${esc(M.fmt(M.get(b)))}</b> · ${b.n} séance${b.n > 1 ? 's' : ''}`;
  t.hidden = false;
  t.style.left = (r.left + r.width / 2) + 'px';
  t.style.top = ((bar ? bar.getBoundingClientRect().top : r.bottom) - 10) + 'px';
}
document.addEventListener('mouseover', ev => { const c = ev.target.closest('.col'); if (c) showTip(c); });
document.addEventListener('mouseout', ev => { if (ev.target.closest('.col') && !ev.relatedTarget?.closest?.('.col')) $('#tip').hidden = true; });
document.addEventListener('focusin', ev => { if (ev.target.classList?.contains('col')) showTip(ev.target); });
document.addEventListener('focusout', ev => { if (ev.target.classList?.contains('col')) $('#tip').hidden = true; });

/* ---------- Historique ---------- */
let openHist = new Set();
let histAll = false;
function vHistory() {
  const ss = allSessions(), now = new Date(), mon = mondayOf(now);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const week = ss.filter(s => new Date(s.date) >= mon), month = ss.filter(s => new Date(s.date) >= monthStart);
  let h = `<h1>Historique</h1><div class="stats">
    <div class="stat"><span class="muted small">Cette semaine</span><b>${week.length}</b></div>
    <div class="stat"><span class="muted small">Ce mois-ci</span><b>${month.length}</b></div>
    <div class="stat"><span class="muted small">Temps ce mois</span><b>${fmtDur(month.reduce((a, s) => a + s.dur, 0))}</b></div>
    <div class="stat"><span class="muted small">Séances au total</span><b>${ss.length}</b></div></div>`;
  const list = histAll ? ss : ss.slice(0, 30);
  h += list.map(s => {
    const op = openHist.has(s.id);
    return `<div class="card hist" data-act="hist" data-id="${s.id}"><div class="row">
      <div style="flex:1"><div class="exname">${esc(s.title)} ${s.src === 'hevy' ? '<span class="tag">Hevy</span>' : ''}</div>
      <div class="muted small">${esc(fmtDate(s.date))} · ${fmtDur(s.dur)} · ${Math.round(volume(s)).toLocaleString('fr-FR')} kg · ${s.ex.length} exercices</div></div>
      ${s.src !== 'hevy' ? `<button class="btn ghost danger" data-act="hdel" data-id="${s.id}" title="Supprimer cette séance">🗑</button>` : ''}</div>
      ${op ? `<div class="hdet">${s.ex.map(e => `<div><b>${esc(e.name)}</b> <span class="muted">— ${e.sets.map(x => esc(fmtSet(x))).join(' · ')}</span></div>`).join('')}</div>` : ''}</div>`;
  }).join('');
  if (!histAll && ss.length > 30) h += `<button class="btn" data-act="histall">Afficher les ${ss.length - 30} séances plus anciennes</button>`;
  return h;
}

function modal(html) { $('#modalbox').classList.remove('wide'); $('#modalbox').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }
function confirmBox(msg, onYes, yesLabel = 'Oui') {
  modal(`<p style="margin-top:0">${msg}</p><div class="row"><div class="spacer"></div><button class="btn" data-act="close">Annuler</button><button class="btn primary" id="yes">${yesLabel}</button></div>`);
  $('#yes').onclick = () => { closeModal(); onYes(); };
}
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const d = b.dataset, A = S.active, ei = +d.e, si = +d.s, ri = +d.r;
  switch (d.act) {
    case 'start': return start(d.id);
    case 'pause': return togglePause();
    case 'finish': return finishDialog();
    case 'save': return saveSession();
    case 'close': return closeModal();
    case 'coach': return coachOpen(d.ex, d.e);
    case 'coplay': case 'corestart': case 'cotempo': case 'cosound': case 'coprep': return coAction(d.act, d.v);
    case 'codone': return coDone();
    case 'coautonow': return CO && coValidate();
    case 'coautocancel': if (CO) { CO.mode = null; coPanel(); } return;
    case 'fiche': return modal(`<h2>${esc(d.ex)}</h2>${ficheHtml(d.ex)}<div class="row" style="margin-top:14px"><div class="spacer"></div><button class="btn" data-act="close">Fermer</button></div>`);
    case 'discard': return confirmBox('Abandonner la séance en cours ? Rien ne sera enregistré.', () => { S.active = null; stopRest(); save(); go('home'); }, 'Abandonner');
    case 'toggle': {
      const x = A.ex[ei].sets[si]; x.done = !x.done; save(); render();
      if (x.done) startRest(A.ex[ei].rest, 'Repos'); else stopRest();
      return;
    }
    case 'timer': return startRest(+A.ex[ei].sets[si].s, 'Effort — ' + A.ex[ei].name);
    case 'addset': { const e = A.ex[ei], l = e.sets[e.sets.length - 1]; e.sets.push({w: l.w, r: l.r, s: l.s, done: false}); save(); return render(); }
    case 'delset': A.ex[ei].sets.pop(); save(); return render();
    case 'exdel': return confirmBox(`Retirer « ${esc(A.ex[ei].name)} » de cette séance ?`, () => { A.ex.splice(ei, 1); save(); render(); }, 'Retirer');
    case 'exup': if (ei > 0) { A.ex.splice(ei - 1, 0, A.ex.splice(ei, 1)[0]); save(); render(); } return;
    case 'addex': {
      const n = $('#addex').value.trim(); if (!n) return $('#addex').focus();
      const type = $('#addtype').value, last = lastFor(n);
      const sets = last ? last.sets : newRoutineEx(n, type).sets;
      A.ex.push(newActiveEx({name: n, type: last && last.sets.every(x => x.s && !x.r) ? 'time' : type, sets, rest: 90}));
      save(); render(); return;
    }
    case 'rest-add': if (rest) { rest.end += +d.v * 1000; rest.rung = false; $('#restbar').classList.remove('ring'); tick(); } return;
    case 'rest-skip': restNotifClose(); return stopRest();
    case 'notifon': return notifOn();
    case 'actadd': return actForm();
    case 'actsave': return actSave();
    case 'jopen': return journalForm(d.day);
    case 'jpick': return journalPick(d.k, d.v);
    case 'jsave': return journalSave();
    case 'radj': case 'rkcal': case 'rlight': return reviewApply(d.act, d.v);
    case 'pip': return pipToggle();
    case 'stper': ST.per = d.v; ST.off = 0; return render();
    case 'stmet': ST.metric = d.v; return render();
    case 'sttable': ST.table = !ST.table; return render();
    case 'stoff': ST.off = Math.max(0, ST.off + +d.v); return render();
    case 'stnow': ST.off = 0; return render();
    case 'stlast': ST.off = offToLast(); return render();
    case 'pstart': return startProg(d.key);
    case 'wsave': return weightSave();
    case 'wdel': { delete (S.weights || {})[d.day]; save(); return render(); }
    case 'pmark': { const P = progState(); P.done[d.key] ? delete P.done[d.key] : P.done[d.key] = 'manuel'; save(); return render(); }
    case 'pweek': openWeek = +d.w; return render();
    case 'rtoggle': openRt.has(d.id) ? openRt.delete(d.id) : openRt.add(d.id); return render();
    case 'radd': {
      const r = {id: uid(), name: 'Nouvelle routine', day: '', exercises: [warm()]};
      S.routines.unshift(r); openRt.add(r.id); search = ''; save(); render();
      return $('input[data-rf="name"]').select();
    }
    case 'rdel': return confirmBox(`Supprimer la routine « ${esc(S.routines[ri].name)} » ?`, () => { S.routines.splice(ri, 1); save(); render(); }, 'Supprimer');
    case 'rup': if (ri > 0) { S.routines.splice(ri - 1, 0, S.routines.splice(ri, 1)[0]); save(); render(); } return;
    case 'xsadd': { const s = S.routines[ri].exercises[ei].sets; s.push({...s[s.length - 1]}); save(); return render(); }
    case 'xsdel': S.routines[ri].exercises[ei].sets.pop(); save(); return render();
    case 'xadd': S.routines[ri].exercises.push(newRoutineEx()); save(); render();
      return [...document.querySelectorAll(`[data-r="${ri}"][data-xf="name"]`)].pop().focus();
    case 'xdel': S.routines[ri].exercises.splice(ei, 1); save(); return render();
    case 'xup': if (ei > 0) { const x = S.routines[ri].exercises; x.splice(ei - 1, 0, x.splice(ei, 1)[0]); save(); render(); } return;
    case 'reset': return confirmBox('Remplacer toutes tes routines par les routines par défaut ? (l\'historique est conservé)', () => { S.routines = defaultRoutines(); save(); render(); }, 'Remplacer');
    case 'export': return exportData();
    case 'gosave': go('routines'); { const c = $('#ghcard'); if (c) c.scrollIntoView({block: 'center'}); } return;
    case 'ghsave': return ghSaveKey();
    case 'ghpush': return ghPush('Sauvegarde manuelle');
    case 'ghpull': return ghAskPull();
    case 'ghforget': return confirmBox('Oublier la clé GitHub sur cet appareil ? Tes données restent ici et sur GitHub.', () => { try { localStorage.removeItem(GH_KEY); } catch (e) {} ghMsg = ''; $('#sync').hidden = true; render(); }, 'Oublier');
    case 'hist': if (ev.target.closest('[data-act="hdel"]')) return; openHist.has(d.id) ? openHist.delete(d.id) : openHist.add(d.id); return render();
    case 'hdel': ev.stopPropagation(); return confirmBox('Supprimer cette séance de l\'historique ?', () => { S.history = S.history.filter(s => s.id !== d.id); save(); render(); }, 'Supprimer');
    case 'histall': histAll = true; return render();
  }
});
document.addEventListener('input', ev => {
  const t = ev.target, d = t.dataset, A = S.active;
  if (t.id === 'rsearch') { search = t.value; $('#rlist').innerHTML = routinesList(); }
  else if (d.xs !== undefined) { S.routines[+d.r].exercises[+d.e].sets[+d.xs][d.k] = t.value === '' ? 0 : +t.value; save(); }
  else if (d.k && A) { A.ex[+d.e].sets[+d.s][d.k] = t.value === '' ? 0 : +t.value; save(); }
  else if (d.ef === 'rest' && A) { A.ex[+d.e].rest = +t.value || 0; save(); }
  else if (d.sf === 'title' && A) { A.title = t.value; save(); }
  else if (d.rf) { const r = S.routines[+d.r]; r[d.rf] = d.rf === 'day' ? (t.value === '' ? '' : +t.value) : t.value; save(); }
  else if (d.xf) {
    const e = S.routines[+d.r].exercises[+d.e];
    e[d.xf] = ['name', 'type'].includes(d.xf) ? t.value : (t.value === '' ? 0 : +t.value);
    if (d.xf === 'type') for (const x of e.sets) {
      if (e.type === 'time') { x.s = x.s || 30; x.r = 0; } else { x.r = x.r || 10; x.s = 0; }
    }
    save(); if (d.xf === 'type') render();
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'pstartdate' && ev.target.value) { const P = progState(); P.start = ev.target.value; P.anchored = true; save(); return render(); }
  if (ev.target.id === 'pnextdate' && ev.target.value) { const nx = progNext(); if (nx) { progState().next = {key: nx.join('-'), date: ev.target.value}; save(); toast('Séance déplacée, la suite suit'); return render(); } }
  if (ev.target.id === 'jday' && ev.target.value) return journalForm(ev.target.value);
  if (ev.target.id === 'pbar') { progState().bar = ev.target.checked; save(); return render(); }
  if (ev.target.id === 'coautochk' && CO) { CO.auto = ev.target.checked; coSavePrefs(); return; }
  if (ev.target.id === 'importfile') {
    const f = ev.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const s = JSON.parse(txt);
      if (!s || !Array.isArray(s.routines) || !Array.isArray(s.history)) throw new Error();
      confirmBox(`Importer ${s.routines.length} routines et ${s.history.length} séances ? Tes données actuelles seront remplacées.`, () => { S = normalize(s); S.v = VERSION; save(); render(); toast('Import terminé'); }, 'Importer');
    }).catch(() => toast('Fichier invalide'));
    ev.target.value = '';
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#modal').hidden) closeModal();
  if (ev.key === 'Enter' && ev.target.id === 'addex') document.querySelector('[data-act="addex"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'sesstitle') { ev.preventDefault(); ev.target.blur(); }
  if (ev.key === ' ' && view === 'session' && S.active && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(ev.target.tagName)) { ev.preventDefault(); togglePause(); }
});
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal') closeModal(); });
// si une autre fenêtre modifie les données
window.addEventListener('storage', ev => { if (ev.key === KEY) { S = load(); allCache = null; render(); } });
// export : en ligne, claude.ai demande où enregistrer le fichier ; en local, téléchargement classique
async function exportData() {
  const filename = 'muscu-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json', data = JSON.stringify(S, null, 1);
  const dl = window.claude && window.claude.use ? await claude.use('downloads') : null;
  if (dl) {
    try { const r = await dl.save({filename, data}); if (r && r.status === 'saved') toast('Sauvegarde exportée'); }
    catch (e) { toast('Export annulé'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
  a.download = filename; a.click();
  toast('Sauvegarde exportée');
}
render();
cloudInit();
ghRetry();
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
