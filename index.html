  const inWin = h => { const d = isoDay(new Date(h.date)); return d >= days[0] && d <= days[6]; };
  const hist = S.history.filter(inWin), keyOf = new Map(Object.entries(P.done).map(([k, id]) => [id, k]));
  const progS = hist.filter(h => keyOf.has(h.id)), cardio = hist.filter(h => h.kind === 'cardio');
  const planned = progDates().filter(d => { const x = isoDay(d); return x >= days[0] && x <= days[6] && x <= isoDay(today); }).length;
  const dayLbl = d => fmtDate(new Date(d + 'T12:00'), {weekday: 'short'});
  const quote = (t, d) => `« ${t.length > 70 ? t.slice(0, 69) + '…' : t} » (${dayLbl(d)})`;
  const items = [], newAdj = {}, reviewed = [];

  // 1. Charges : toutes les reps faites → +2 kg ; 2 séries ou plus ratées de 2 reps → −2 kg
  const up = [], down = [], bw = [];
  for (const h of progS.slice().reverse()) {
    if ((P.reviewed || {})[h.id]) continue;
    const [w, d] = keyOf.get(h.id).split('-').map(Number), plan = progSession(w, d);
    for (const pe of plan.exercises) {
      const de = h.ex.find(x => x.name === pe.name); if (!de || pe.type !== 'reps') continue;
      const ps = pe.sets, ds = de.sets, hit = ds.length >= ps.length && ps.every((p, i) => ds[i] && ds[i].r >= p.r);
      const miss = ps.filter((p, i) => !ds[i] || ds[i].r <= p.r - 2).length >= 2;
      if (!ps[0].w) { if (hit) bw.push(pe.name); continue; }
      const doneW = Math.max(...ds.map(x => +x.w || 0)), base = (adj[pe.name] || 0) + doneW - ps[0].w;
      if (hit) { newAdj[pe.name] = base + 2; up.push(pe.name); }
      else if (miss) { newAdj[pe.name] = base - 2; down.push(pe.name); }
    }
    reviewed.push(h.id);
  }
  const short = n => n.replace(/ \((haltère|kettlebell)\)/, '');
  // l'élément « Charges » est ajouté à la fin : il dépend de la fatigue (fatigué → on ne monte pas)
  const chargesItem = tired => {
    if (tired) for (const n of up) delete newAdj[n];
    const upTxt = [...new Set(up)].map(short).join(', '), dnTxt = [...new Set(down)].map(short).join(', ');
    const d = [up.length ? (tired ? `Toutes les reps faites sur ${esc(upTxt)}, mais tu es fatigué : on garde ces charges cette semaine.` : `Toutes les reps faites : <b>+2 kg</b> sur ${esc(upTxt)}.`) : '',
      down.length ? `Plusieurs séries ratées : <b>−2 kg</b> sur ${esc(dnTxt)}.` : ''].filter(Boolean).join(' ');
    return Object.keys(newAdj).length ? {ic: '📈', t: 'Charges de tes prochaines séances', d, act: 'radj', btn: 'Appliquer aux prochaines séances'}

  const foodLow = js.filter(j => j.food === 2).length, kcalRecent = S.kcalAt && (today - new Date(S.kcalAt + 'T00:00')) / 864e5 < 7;

  if (wNow.length < 3) items.push({ic: '⚖️', t: `Pèse-toi au moins 3 matins (${wNow.length} cette semaine)`, d: 'Sans moyenne de la semaine, l\'appli ne peut pas régler tes calories.'});
  else if (dW == null) items.push({ic: '⚖️', t: `Moyenne de la semaine : ${kgf(avg(wNow))} kg`, d: 'La semaine prochaine, l\'appli la comparera à celle-ci.'});

    else items.push({ic: '🍽', t: `Prise trop lente : ${dW >= 0 ? '+' : ''}${kgf(dW, 2)} kg (objectif +0,25)`, d: 'Ajoute environ 150 kcal par jour : un grand verre de lait, ou 1 c. à soupe d\'huile dans un plat.', act: kcalRecent ? null : 'rkcal', v: 150, btn: '+150 kcal par jour'});
  } else if (dW > .45) items.push({ic: '🍽', t: `Prise trop rapide : +${kgf(dW, 2)} kg (objectif +0,25)`, d: 'Enlève environ 150 kcal par jour, par exemple la moitié du beurre de cacahuète.', act: kcalRecent ? null : 'rkcal', v: -150, btn: '−150 kcal par jour'});
  else items.push({ic: '✅', t: `Poids : +${kgf(dW, 2)} kg, dans l'objectif`, d: 'Garde tes repas tels quels.'});

  // 3. Récupération
  const sleepAvg = avg(sleeps), enAvg = avg(energies), soreHigh = js.filter(j => j.sore === 2).length;
  if (sleeps.length >= 3 && sleepAvg < 7) items.push({ic: '😴', t: `Sommeil moyen : ${kgf(sleepAvg)} h`, d: 'Vise 8 h : couche-toi 30 min plus tôt et coupe les écrans avant. C\'est la nuit que le muscle se reconstruit.'});
  const tired = (energies.length >= 3 && enAvg <= 2.5) || soreHigh >= 3 || down.length >= 2;
  const nx = progNext(), lightW = nx ? nx[0] : null, isLight = lightW != null && (P.light || {})[lightW];
  if (tired) items.push({ic: '🔋', t: 'Fatigue élevée cette semaine', d: `${energies.length ? `Énergie moyenne ${kgf(enAvg)}/5. ` : ''}${soreHigh ? `Fortes courbatures ${soreHigh} jour(s). ` : ''}Une semaine allégée (une série de moins, −10 %) te fera repartir plus fort.`,
    act: isLight ? null : 'rlight', btn: `Alléger la semaine ${lightW + 1}`});

    repas: 'Tu notes des repas manqués : prépare les boîtes du dimanche et du mercredi, et garde un shake lait + flocons d\'avoine en secours.',
    stress: 'Tu notes du stress : marche 10 min après le déjeuner, et garde la séance même plus courte, c\'est la régularité qui compte.',
    facile: 'Tu trouves ça facile : si toutes tes reps passent, le bilan monte la charge (voir « Charges »).',

  for (const k of Object.keys(NOTE_SIGNS)) { const j = sign(k); if (j) items.push({ic: '✍️', t: esc(quote(j.note, j.day)), d: say[k]}); }

  // 6. Régularité
  const cardMin = Math.round(cardio.reduce((a, h) => a + (h.dur || 0), 0) / 60);

}
function reviewItem(it) {

}

  return `${compact ? '' : `<div class="stats rvt">${R.tiles.map(([k, v]) => `<div class="stat"><span class="small">${k}</span><b>${v}</b></div>`).join('')}</div>`}
    <div class="rv">${items.map(reviewItem).join('') || '<p class="small muted">Rien à régler pour l\'instant.</p>'}</div>
    ${!compact && S.kcalAdj ? `<p class="small muted">Calories du plan réglées par le bilan : ${S.kcalAdj > 0 ? '+' : ''}${S.kcalAdj} kcal par jour.</p>` : ''}`;
}

  return `<h2>Bilan de la semaine</h2>${reviewHtml(true)}<button class="btn ghost" data-go="plan" style="margin-top:6px">Voir tout le bilan et le journal →</button>`;

  <h2>La méthode : comment savoir si c'est vrai</h2>
  <details class="card"><summary>Trois sortes de savoir dans tes livres</summary>
    <p><b>Les mécanismes</b> (Neumann, Kapandji, Guyton, Wilmore) disent ce qui est <i>possible</i> : quel muscle tire, dans quel axe. Ils ne disent pas ce qui marche le mieux sur des mois.</p>
    <p><b>Les essais et leurs synthèses</b> (résumés par Helms, Israetel, Aragon, la NSCA) disent ce qui marche <i>en moyenne</i>. Ils portent souvent sur 8 à 12 semaines, avec des étudiants débutants.</p>
    <p><b>Le savoir des praticiens</b> (Delavier, Rippetoe, Wendler, Starrett, McGill en clinique) a été testé sur beaucoup de gens, mais sans groupe témoin. C'est une tradition qui a survécu, pas une preuve.</p></details>
  <details class="card"><summary>Les pièges classiques</summary>
    <p><b>L'effet débutant.</b> Rippetoe remarque que les études universitaires utilisent des étudiants débutants, chez qui « tout marche, plus ou moins ». Comparer deux programmes sur eux départage mal les méthodes.</p>
    <p><b>Corrélation n'est pas causalité.</b> La poigne et la démence, la VO2max et la mortalité (Attia) viennent d'études d'observation. Les gens malades perdent leur force (causalité inverse) et les gens actifs ont d'autres bonnes habitudes (confusion). C'est le mécanisme plausible, plus les essais, qui en font un pari raisonnable.</p>
    <p><b>Les mesures de substitution.</b> Une forte activation EMG (hip thrust) ou un pic de synthèse protéique après un repas (leucine) ne garantissent pas des kilos de muscle sur des mois.</p>
    <p><b>Les intérêts.</b> Plusieurs auteurs vendent aussi des programmes, des applis ou des produits. Ça ne rend pas leurs idées fausses, mais ça demande des preuves venues d'ailleurs.</p></details>

let statBuckets = [];

  week: {n: 12, label: 'Semaine', cur: 'cette semaine', prev: 'semaine dernière'},

function fmtHM(sec) { const m = Math.round(sec / 60), h = Math.floor(m / 60); return h ? `${h} h ${String(m % 60).padStart(2, '0')} min` : `${m} min`; }
const fmtVol = kg => Math.round(kg).toLocaleString('fr-FR') + ' kg';
function perStart(d, per) {
  if (per === 'week') return mondayOf(d);
  return per === 'month' ? new Date(d.getFullYear(), d.getMonth(), 1) : new Date(d.getFullYear(), 0, 1);
}
function perAdd(d, per, n) {
  const x = new Date(d);
  if (per === 'week') x.setDate(x.getDate() + 7 * n);
  else if (per === 'month') x.setMonth(x.getMonth() + n);
  else x.setFullYear(x.getFullYear() + n);

}
const perKey = (d, per) => isoDay(perStart(d, per));
function perLabel(d, per, long) {
  if (per === 'year') return String(d.getFullYear());
  if (per === 'month') return long ? fmtDate(d, {month: 'long', year: 'numeric'}) : fmtDate(d, {month: 'short'}) + (d.getMonth() === 0 ? ' ' + String(d.getFullYear()).slice(2) : '');
  return long ? 'Semaine du ' + fmtDate(d, {day: 'numeric', month: 'short', year: 'numeric'}) : fmtDate(d, {day: 'numeric', month: 'short'});
}
function aggregate(per) {
  const m = new Map();
  for (const s of allSessions()) {
    const k = perKey(new Date(s.date), per), b = m.get(k) || {dur: 0, vol: 0, n: 0};
    b.dur += s.dur || 0; b.vol += volume(s); b.n++; m.set(k, b);
  }

}

function offToLast() {
  const last = allSessions()[0]; if (!last || ST.per === 'year') return 0;

}
function niceStep(max) {
  const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw)), n = raw / p;

}
function vStats() {
  const seg = `<div class="seg wide" role="group" aria-label="Stats">${[['all', 'Vue d\'ensemble'], ['body', 'Corps'], ['food', 'Nourriture']].map(([k, l]) =>

function vStatsAll() {
  const P = PER[ST.per], M = METRIC[ST.metric], agg = aggregate(ST.per), now = new Date();

/* ---------- Historique ---------- */
let openHist = new Set();
let histAll = false;
// Historique « Par jour » : tout ce qui s'est passé un jour donné (journal complet, poids, séances, activités)
let HV = {mode: 'day', day: null};
const dayShift = (day, n) => { const x = new Date(day + 'T12:00'); x.setDate(x.getDate() + n); return isoDay(x); };
function histTabs() {
  return `<div class="jseg htabs" role="group" aria-label="Affichage">${[['day', '📅 Par jour'], ['list', '🏋️ Toutes les séances']].map(([k, l]) =>

}
function dayPage(day) {
  const today = isoDay(new Date()), J = (S.journal || {})[day], W = S.weights || {};
  const sess = allSessions().filter(x => isoDay(new Date(x.date)) === day).sort((a, b) => new Date(a.date) - new Date(b.date));
  let h = `<div class="daynav"><button class="btn" data-act="dayopen" data-day="${dayShift(day, -1)}" aria-label="Jour précédent">‹</button>
    <div class="dayt"><b>${esc(fmtDate(new Date(day + 'T12:00'), {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}))}</b>
      <input type="date" class="field" id="dayjump" value="${day}" max="${today}" aria-label="Aller au jour"></div>
    <button class="btn" data-act="dayopen" data-day="${dayShift(day, 1)}" ${day >= today ? 'disabled' : ''} aria-label="Jour suivant">›</button></div>`;
  // journal complet
  const f = [];
  if (W[day] != null) f.push(['Poids', `${kgf(W[day])} kg`]);
  if (J) {
    if (J.sleep != null) f.push(['Sommeil', `${kgf(J.sleep)} h`]);
    if (J.energy != null) f.push(['Énergie', `${J.energy}/5`]);
    if (J.sore != null) f.push(['Courbatures', JSORE[J.sore]]);
    if (J.food != null) f.push(['Repas', JFOOD[J.food]]);
    if (J.pain) f.push(['Douleur', J.pain]);
  }
  h += `<div class="card"><div class="row"><div class="exname" style="flex:1">📝 Journal</div>
    <button class="btn ${J ? '' : 'primary'}" data-act="jopen" data-day="${day}">${J ? 'Modifier' : 'Remplir'}</button></div>
    ${f.length ? `<div class="jgrid">${f.map(([k, v]) => `<div class="stat"><span class="small">${k}</span><b>${esc(v)}</b></div>`).join('')}</div>` : ''}
    ${J && J.note ? `<blockquote class="jnote">${esc(J.note)}</blockquote>` : ''}
    ${!f.length && !(J && J.note) ? '<p class="small muted" style="margin:8px 0 0">Rien noté ce jour-là.</p>' : ''}</div>`;
  // séances et activités du jour, détaillées
  h += `<h2>Séances et activités</h2>` + (sess.length ? sess.map(x => `<div class="card"><div class="exname">${esc(x.title)} ${x.src === 'hevy' ? '<span class="tag">Hevy</span>' : ''}</div>
      <div class="muted small">${esc(new Date(x.date).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}))} · ${fmtDur(x.dur)}${volume(x) ? ' · ' + Math.round(volume(x)).toLocaleString('fr-FR') + ' kg soulevés' : ''}</div>
      ${x.note ? `<p class="small" style="margin:6px 0 0">${esc(x.note)}</p>` : ''}
      <div class="hdet">${x.ex.map(e => `<div><b>${esc(e.name)}</b> <span class="muted">— ${e.sets.map(y => esc(fmtSet(y))).join(' · ')}</span></div>`).join('')}</div></div>`).join('')
    : `<div class="card"><p class="small muted" style="margin:0">Aucune séance ce jour-là.</p><div class="row" style="margin-top:8px"><button class="btn" data-act="actadd">🏃 Ajouter une activité</button></div></div>`);
  // les 14 derniers jours, pour naviguer
  const rows = Array.from({length: 14}, (_, i) => dayShift(today, -i)).map(d => {
    const n = allSessions().filter(x => isoDay(new Date(x.date)) === d), jj = (S.journal || {})[d];
    const icons = [n.some(x => x.kind !== 'cardio') ? '🏋️' : '', n.some(x => x.kind === 'cardio') ? '🏃' : '', jj ? '📝' : '', W[d] != null ? `⚖️ ${kgf(W[d])}` : ''].filter(Boolean).join(' ');
    return `<button type="button" class="dayrow ${d === day ? 'on' : ''}" data-act="dayopen" data-day="${d}"><span>${esc(fmtDate(new Date(d + 'T12:00'), {weekday: 'short', day: 'numeric', month: 'short'}))}</span><span class="muted">${icons || '—'}</span></button>`;
  }).join('');
  return h + `<h2>Les 14 derniers jours</h2><div class="card daylist">${rows}</div>`;
}
function vHistory() {
  if (HV.mode === 'day') return `<h1>Historique</h1>${histTabs()}${dayPage(HV.day || isoDay(new Date()))}`;
  const ss = allSessions(), now = new Date(), mon = mondayOf(now);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const week = ss.filter(s => new Date(s.date) >= mon), month = ss.filter(s => new Date(s.date) >= monthStart);
  let h = `<h1>Historique</h1>${histTabs()}<div class="stats">
    <div class="stat"><span class="muted small">Cette semaine</span><b>${week.length}</b></div>
    <div class="stat"><span class="muted small">Ce mois-ci</span><b>${month.length}</b></div>
    <div class="stat"><span class="muted small">Temps ce mois</span><b>${fmtDur(month.reduce((a, s) => a + s.dur, 0))}</b></div>
    <div class="stat"><span class="muted small">Séances au total</span><b>${ss.length}</b></div></div>`;
  const list = histAll ? ss : ss.slice(0, 30);
  h += list.map(s => {
    const op = openHist.has(s.id);
    return `<div class="card hist" data-act="hist" data-id="${s.id}"><div class="row">
      <div style="flex:1"><div class="exname">${esc(s.title)} ${s.src === 'hevy' ? '<span class="tag">Hevy</span>' : ''}</div>
      <div class="muted small">${esc(fmtDate(s.date))} · ${fmtDur(s.dur)} · ${Math.round(volume(s)).toLocaleString('fr-FR')} kg · ${s.ex.length} exercices</div></div>
      ${s.src !== 'hevy' ? `<button class="btn ghost danger" data-act="hdel" data-id="${s.id}" title="Supprimer cette séance">🗑</button>` : ''}</div>
      ${op ? `<div class="hdet">${s.ex.map(e => `<div><b>${esc(e.name)}</b> <span class="muted">— ${e.sets.map(x => esc(fmtSet(x))).join(' · ')}</span></div>`).join('')}</div>` : ''}</div>`;
  }).join('');
  if (!histAll && ss.length > 30) h += `<button class="btn" data-act="histall">Afficher les ${ss.length - 30} séances plus anciennes</button>`;
  return h;
}

      return [...document.querySelectorAll(`[data-r="${ri}"][data-xf="name"]`)].pop().focus();
    case 'xdel': S.routines[ri].exercises.splice(ei, 1); save(); return render();
    case 'xup': if (ei > 0) { const x = S.routines[ri].exercises; x.splice(ei - 1, 0, x.splice(ei, 1)[0]); save(); render(); } return;
    case 'reset': return confirmBox('Remplacer toutes tes routines par les routines par défaut ? (l\'historique est conservé)', () => { S.routines = defaultRoutines(); save(); render(); }, 'Remplacer');
    case 'export': return exportData();
    case 'gosave': go('routines'); { const c = $('#ghcard'); if (c) c.scrollIntoView({block: 'center'}); } return;
    case 'ghsave': return ghSaveKey();
    case 'ghpush': return ghPush('Sauvegarde manuelle');
    case 'ghpull': return ghAskPull();
    case 'ghforget': return confirmBox('Oublier la clé GitHub sur cet appareil ? Tes données restent ici et sur GitHub.', () => { try { localStorage.removeItem(GH_KEY); } catch (e) {} ghMsg = ''; $('#sync').hidden = true; render(); }, 'Oublier');
    case 'hmode': HV.mode = d.v; return render();
    case 'dayopen': HV.mode = 'day'; HV.day = d.day; return go('history');
    case 'hist': if (ev.target.closest('[data-act="hdel"]')) return; openHist.has(d.id) ? openHist.delete(d.id) : openHist.add(d.id); return render();
    case 'hdel': ev.stopPropagation(); return confirmBox('Supprimer cette séance de l\'historique ?', () => { S.history = S.history.filter(s => s.id !== d.id); save(); render(); }, 'Supprimer');
    case 'histall': histAll = true; return render();
  }
});
document.addEventListener('input', ev => {
  const t = ev.target, d = t.dataset, A = S.active;
  if (t.id === 'lxq') { LX.q = t.value; return lxRefresh(); }
  if (t.id === 'faq') { FA.q = t.value; const r = $('#fares'); if (r) r.innerHTML = foodResults(); return; }
  if (t.id === 'fag' && FA.pick) { FA.pick.g = +t.value || 0; const e = $('#fatot'); if (e) e.innerHTML = foodTotHtml(foodTot(FA.pick.per, FA.pick.g));
    document.querySelectorAll('.fq-chips .lx-chip').forEach(c => c.classList.toggle('on', +c.dataset.v === FA.pick.g)); return; }
  if (t.id === 'feg') { const x = foodDay(t.dataset.day).find(e => e.id === t.dataset.id), e = $('#fatot'); if (x && e) e.innerHTML = foodTotHtml(foodTot(x.per, +t.value || 0)); return; }
  if (t.id === 'rsearch') { search = t.value; $('#rlist').innerHTML = routinesList(); }
  else if (d.xs !== undefined) { S.routines[+d.r].exercises[+d.e].sets[+d.xs][d.k] = t.value === '' ? 0 : +t.value; save(); }
  else if (d.k && A) { A.ex[+d.e].sets[+d.s][d.k] = t.value === '' ? 0 : +t.value; save(); }
  else if (d.ef === 'rest' && A) { A.ex[+d.e].rest = +t.value || 0; save(); }
  else if (d.sf === 'title' && A) { A.title = t.value; save(); }
  else if (d.rf) { const r = S.routines[+d.r]; r[d.rf] = d.rf === 'day' ? (t.value === '' ? '' : +t.value) : t.value; save(); }
  else if (d.xf) {
    const e = S.routines[+d.r].exercises[+d.e];
    e[d.xf] = ['name', 'type'].includes(d.xf) ? t.value : (t.value === '' ? 0 : +t.value);
    if (d.xf === 'type') for (const x of e.sets) {
      if (e.type === 'time') { x.s = x.s || 30; x.r = 0; } else { x.r = x.r || 10; x.s = 0; }
    }
    save(); if (d.xf === 'type') render();
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'pstartdate' && ev.target.value) { const P = progState(); P.start = ev.target.value; P.anchored = true; save(); return render(); }
  if (ev.target.id === 'pnextdate' && ev.target.value) { const nx = progNext(); if (nx) { progState().next = {key: nx.join('-'), date: ev.target.value}; save(); toast('Séance déplacée, la suite suit'); return render(); } }
  if (ev.target.id === 'jday' && ev.target.value) return journalForm(ev.target.value);
  if (ev.target.id === 'dayjump' && ev.target.value) { HV.mode = 'day'; HV.day = ev.target.value; return render(); }
  if (ev.target.id === 'pbar') { progState().bar = ev.target.checked; save(); return render(); }
  if (ev.target.id === 'coautochk' && CO) { CO.auto = ev.target.checked; coSavePrefs(); return; }
  if (ev.target.id === 'importfile') {
    const f = ev.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const s = JSON.parse(txt);
      if (!s || !Array.isArray(s.routines) || !Array.isArray(s.history)) throw new Error();
      confirmBox(`Importer ${s.routines.length} routines et ${s.history.length} séances ? Tes données actuelles seront remplacées.`, () => { S = normalize(s); S.v = VERSION; save(); render(); toast('Import terminé'); }, 'Importer');
    }).catch(() => toast('Fichier invalide'));
    ev.target.value = '';
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#modal').hidden) closeModal();
  if (ev.key === 'Enter' && ev.target.id === 'fabar') return offLookup(ev.target.value);
  if (ev.key === 'Enter' && ev.target.id === 'addex') document.querySelector('[data-act="addex"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'sesstitle') { ev.preventDefault(); ev.target.blur(); }
  if (ev.key === ' ' && view === 'session' && S.active && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(ev.target.tagName)) { ev.preventDefault(); togglePause(); }
});
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal') closeModal(); });
// si une autre fenêtre modifie les données
window.addEventListener('storage', ev => { if (ev.key === KEY) { S = load(); allCache = null; render(); } });
// export : en ligne, claude.ai demande où enregistrer le fichier ; en local, téléchargement classique
async function exportData() {
  const filename = 'muscu-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json', data = JSON.stringify(S, null, 1);
  const dl = window.claude && window.claude.use ? await claude.use('downloads') : null;
  if (dl) {
    try { const r = await dl.save({filename, data}); if (r && r.status === 'saved') toast('Sauvegarde exportée'); }
    catch (e) { toast('Export annulé'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
  a.download = filename; a.click();
  toast('Sauvegarde exportée');
}
render();
cloudInit();
ghRetry();
</script>

}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
